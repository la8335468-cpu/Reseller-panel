<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0C16;
            --card: #141727;
            --card-inner: #0D0F1B;
            --input: #0D0F1C;
            --primary: #6366F1;
            --success: #10B981;
            --danger: #EF4444;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #1E233D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 22px 14px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 18px; font-weight: 800; color: #60A5FA; }
        .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 14px; text-transform: uppercase; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
        .input-group input { width: 100%; background-color: var(--input); border: 1px solid var(--border); color: #fff; padding: 11px 13px; border-radius: 12px; font-size: 13px; outline: none; }
        .btn-act { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--success); color: #fff; }
        .reseller-item { background-color: var(--card-inner); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
        .badge-active { background: rgba(16,185,129,0.15); color: #10B981; }
        .badge-expired { background: rgba(239,68,68,0.15); color: #EF4444; }
        .btn-small { border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 6px; }
    </style>
</head>
<body>

<div class="container" id="dashView">
    <div class="header">
        <div>
            <h1>🛡️ ADMIN CONTROL PANEL</h1>
            <div style="font-size:12px; color:var(--text-muted);" id="dispAdminUser">Welcome, --</div>
        </div>
        <button onclick="doLogout()" style="background:#2D151B; color:#EF4444; border:none; padding:8px 14px; border-radius:12px; font-weight:700; cursor:pointer;">↪ LOGOUT</button>
    </div>

    <!-- CREATE RESELLER -->
    <div class="card">
        <div class="card-title">👤 CREATE RESELLER ACCOUNT</div>
        <form onsubmit="createReseller(event)">
            <div class="form-grid">
                <div class="input-group">
                    <label>Reseller User ID</label>
                    <input type="text" id="new_reseller_user" placeholder="e.g. seller_aman" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="text" id="new_reseller_pass" placeholder="password" required>
                </div>
                <div class="input-group">
                    <label>Validity Days</label>
                    <input type="number" id="new_reseller_days" value="30" required>
                </div>
                <div class="input-group">
                    <label>Initial Balance (₹)</label>
                    <input type="number" id="new_reseller_bal" value="500" required>
                </div>
            </div>
            <button type="submit" class="btn-act">CREATE RESELLER</button>
        </form>
    </div>

    <!-- RESELLERS LIST -->
    <div class="card">
        <div class="card-title">📋 MY REGISTERED RESELLERS</div>
        <div id="resellersList"><div style="text-align:center; color:var(--text-muted); padding:15px;">Loading...</div></div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let currentAdmin = localStorage.getItem('admin_logged_user') || '';

    // Direct Portal Redirect on Logout
    function doLogout() {
        localStorage.removeItem('admin_logged_user');
        window.location.replace('/'); // Instant redirect to License Manager Portal
    }

    // Auth Guard
    if (!currentAdmin) {
        window.location.replace('/');
    } else {
        document.getElementById('dispAdminUser').innerText = `Logged in as @${currentAdmin.toUpperCase()}`;
        loadResellers();
    }

    async function loadResellers() {
        const container = document.getElementById('resellersList');
        try {
            const res = await fetch(`${API_BASE}/admin/get_resellers?admin_user=${encodeURIComponent(currentAdmin)}`);
            const data = await res.json();
            if (!data || data.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:15px;">Aapne abhi koi reseller create nahi kiya hai.</div>';
                return;
            }
            const now = Date.now();
            let html = '';
            data.forEach(r => {
                const exp = r.expiry_timestamp || 0;
                const remDays = exp > 0 ? Math.ceil((exp - now) / (1000 * 60 * 60 * 24)) : 0;
                const isExp = remDays <= 0 && exp > 0;
                html += `
                    <div class="reseller-item">
                        <div>
                            <div style="font-size:14px; font-weight:700; color:#60A5FA;">👤 ${String(r.username).toUpperCase()} <span class="badge ${isExp ? 'badge-expired' : 'badge-active'}">${isExp ? 'EXPIRED' : remDays + ' DIN'}</span></div>
                            <div style="font-size:11px; color:var(--text-muted); margin-top:3px;">Password: <b>${r.password}</b> | Wallet: <b>₹${(r.balance||0).toFixed(2)}</b></div>
                        </div>
                        <div>
                            <button class="btn-small" style="background:#132A22; color:#10B981;" onclick="rechargeReseller('${r.username}')">+ RECHARGE</button>
                            <button class="btn-small" style="background:#2D151B; color:#EF4444;" onclick="deleteReseller('${r.username}')">DELETE</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (e) { container.innerHTML = '<div style="color:red; text-align:center;">Load fail</div>'; }
    }

    async function createReseller(e) {
        e.preventDefault();
        const body = new URLSearchParams({
            admin_user: currentAdmin,
            username: document.getElementById('new_reseller_user').value.trim().toLowerCase(),
            password: document.getElementById('new_reseller_pass').value.trim(),
            days: document.getElementById('new_reseller_days').value,
            balance: document.getElementById('new_reseller_bal').value
        });
        try {
            const res = await fetch(`${API_BASE}/admin/create_reseller`, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body });
            const data = await res.json();
            alert(data.msg || "Created!");
            if (data.success) {
                document.getElementById('new_reseller_user').value = '';
                document.getElementById('new_reseller_pass').value = '';
                loadResellers();
            }
        } catch (e) { alert("Error creating reseller"); }
    }

    async function rechargeReseller(user) {
        const amt = prompt(`Reseller [${user.toUpperCase()}] ke wallet me kitna rupya add karna hai?`, "500");
        if (!amt || parseFloat(amt) <= 0) return;
        const body = new URLSearchParams({ admin_user: currentAdmin, username: user, amount: amt });
        try {
            const res = await fetch(`${API_BASE}/admin/recharge_reseller`, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body });
            const data = await res.json();
            if (data.success) { alert("Recharge successful!"); loadResellers(); }
        } catch (e) { alert("Error!"); }
    }

    async function deleteReseller(user) {
        if (!confirm(`Reseller [${user.toUpperCase()}] ko permanently delete karein?`)) return;
        const body = new URLSearchParams({ username: user });
        try {
            const res = await fetch(`${API_BASE}/admin/delete_reseller`, { method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body });
            const data = await res.json();
            if (data.success) { alert("Deleted!"); loadResellers(); }
        } catch (e) { alert("Error!"); }
    }
</script>

</body>
</html>
