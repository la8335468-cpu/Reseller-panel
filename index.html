<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Manager - Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070913;
            --card: #0F1426;
            --input: #080B18;
            --border: #1B223C;
            --primary: #0088FF;
            --primary-glow: #00A3FF;
            --success: #10B981;
            --text-main: #FFFFFF;
            --text-muted: #8490B5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 14px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 136, 255, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(138, 43, 226, 0.18) 0%, transparent 45%);
            background-attachment: fixed;
        }

        .portal-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: rgba(15, 20, 38, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 34px 24px 26px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 136, 255, 0.08);
            text-align: center;
        }

        .shield-icon-box {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px auto;
            background: linear-gradient(135deg, #00A3FF, #0055FF);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0, 136, 255, 0.4);
            font-size: 26px;
        }

        .portal-title {
            font-size: 21px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }

        .portal-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 22px;
            font-weight: 500;
        }

        .role-tabs {
            display: flex;
            background-color: #0A0D1B;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .role-tab {
            flex: 1;
            padding: 10px 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border: none;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .role-tab.active {
            background: linear-gradient(135deg, #00A3FF, #0066FF);
            color: #FFFFFF;
            box-shadow: 0 4px 16px rgba(0, 136, 255, 0.4);
        }

        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: #7280A7;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background-color: var(--input);
            border: 1px solid var(--border);
            color: #FFFFFF;
            padding: 13px 14px;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-glow);
        }

        .eye-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6C7A9C;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-signin {
            width: 100%;
            background: linear-gradient(135deg, #00A3FF, #0077FF);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 8px 24px rgba(0, 136, 255, 0.35);
            transition: 0.15s;
        }

        .btn-signin:active {
            transform: scale(0.98);
        }

        .system-status {
            margin-top: 18px;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }
    </style>
</head>
<body>

<div class="portal-wrapper">
    <div class="login-card">
        <div class="shield-icon-box">🛡️</div>

        <div class="portal-title">License Manager</div>
        <div class="portal-subtitle">Secure Admin & Reseller Portal</div>

        <!-- 2 TABS (Admin AK & Reseller) -->
        <div class="role-tabs">
            <button type="button" class="role-tab active" id="tabAdmin" onclick="setRole('admin')">
                👑 Admin AK
            </button>
            <button type="button" class="role-tab" id="tabReseller" onclick="setRole('reseller')">
                🤝 Reseller
            </button>
        </div>

        <form onsubmit="handleFastLogin(event)">
            <div class="input-group">
                <label id="lblUsername">ADMIN USERNAME</label>
                <div class="input-wrapper">
                    <input type="text" id="loginUser" placeholder="Enter admin username" autocomplete="username" required>
                </div>
            </div>

            <div class="input-group">
                <label>PASSWORD</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPass" placeholder="Enter password" autocomplete="current-password" required>
                    <button type="button" class="eye-toggle" onclick="togglePassVisibility()">👁️</button>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-signin">Sign In to Dashboard →</button>
        </form>

        <div class="system-status">
            <span class="status-dot"></span> System Secure & Online
        </div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let selectedRole = 'admin';

    function setRole(role) {
        selectedRole = role;
        const tabA = document.getElementById('tabAdmin');
        const tabR = document.getElementById('tabReseller');
        const lbl = document.getElementById('lblUsername');
        const userInput = document.getElementById('loginUser');

        if (role === 'admin') {
            tabA.className = 'role-tab active';
            tabR.className = 'role-tab';
            lbl.innerText = 'ADMIN USERNAME';
            userInput.placeholder = 'Enter admin username';
        } else {
            tabA.className = 'role-tab';
            tabR.className = 'role-tab active';
            lbl.innerText = 'RESELLER USERNAME';
            userInput.placeholder = 'Enter reseller username';
        }
    }

    function togglePassVisibility() {
        const p = document.getElementById('loginPass');
        p.type = p.type === 'password' ? 'text' : 'password';
    }

    async function handleFastLogin(e) {
        e.preventDefault();
        const u = document.getElementById('loginUser').value.trim().toLowerCase();
        const p = document.getElementById('loginPass').value.trim();
        const btn = document.getElementById('btnSubmit');

        btn.disabled = true;
        btn.innerText = "Signing in...";

        // 1. ADMIN TAB LOGIN
        if (selectedRole === 'admin') {
            // Master Admin direct check
            if (u === 'master' || u === 'owner') {
                window.location.replace('/master');
                return;
            }

            // Sub-Admin Fast Login
            try {
                const body = new URLSearchParams({ username: u, password: p });
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: body
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('admin_logged_user', u);
                    window.location.replace('/admin'); // Instant Replace
                } else {
                    alert(data.msg || "Invalid Admin Credentials!");
                    btn.disabled = false;
                    btn.innerText = "Sign In to Dashboard →";
                }
            } catch (err) {
                alert("Server connection error!");
                btn.disabled = false;
                btn.innerText = "Sign In to Dashboard →";
            }
        } 
        // 2. RESELLER TAB LOGIN
        else {
            try {
                const body = new URLSearchParams({ username: u, password: p });
                const res = await fetch(`${API_BASE}/reseller/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: body
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('reseller_user', u);
                    window.location.replace('/seller'); // Instant Replace to 3-Folder Dashboard
                } else {
                    alert(data.msg || "Invalid Reseller Credentials!");
                    btn.disabled = false;
                    btn.innerText = "Sign In to Dashboard →";
                }
            } catch (err) {
                alert("Server connection error!");
                btn.disabled = false;
                btn.innerText = "Sign In to Dashboard →";
            }
        }
    }
</script>

</body>
</html>
